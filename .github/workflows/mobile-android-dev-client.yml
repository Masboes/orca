name: Mobile Android Dev Client

# Fork-only. Builds a debug APK containing expo-dev-client, so UI changes can be
# hot-reloaded from a Metro server instead of costing a full release build each
# time. Not part of any release flow.
on:
  workflow_dispatch:

jobs:
  dev-client-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.24.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Build Android debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload dev-client APK
        uses: actions/upload-artifact@v7
        with:
          name: orca-mobile-dev-client-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
